<!doctype html>
<html>
  <head>
    <title>Marquee tag</title>
  </head>
  <body>
    <marquee
      direction="right"
      style="background-color: brown"
      loop="5"
      behaviour="scroll"
      height="200px"
      width="300px"
      vspace="10px"
    >
      Welcome to my Webpage
    </marquee>
  </body>
</html>
